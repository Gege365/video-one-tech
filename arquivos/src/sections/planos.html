<!-- 4. PLANOS -->
<section class="planos" id="planos" data-secao="planos">
  <div class="planos__topo" data-revela>
    <h2 class="titulo">
      <span class="linha"><span>Escolha</span></span>
      <span class="linha"><span>o tamanho.</span></span>
    </h2>
    <div class="alternador" role="radiogroup" aria-label="Cobrança" data-alternador>
      <span class="alternador__fundo" aria-hidden="true"></span>
      <button type="button" role="radio" aria-checked="true" data-ciclo="mensal">Mensal</button>
      <button type="button" role="radio" aria-checked="false" data-ciclo="anual">Anual <span class="alternador__desc">−20%</span></button>
    </div>
  </div>

  <div class="planos__lista" role="radiogroup" aria-label="Planos" data-planos>
    <button class="plano" type="button" role="radio" aria-checked="false" data-plano="site" data-mensal="19,90" data-anual="15,90">
      <span class="plano__ponto" aria-hidden="true"></span>
      <span class="plano__nome">Site</span>
      <span class="plano__spec">1 site · 20 GB · e-mail profissional</span>
      <span class="plano__preco"><span class="plano__moeda">R$</span><span class="plano__valor">19,90</span><span class="plano__mes">/mês</span></span>
    </button>
    <button class="plano" type="button" role="radio" aria-checked="true" data-plano="negocio" data-mensal="39,90" data-anual="31,90">
      <span class="plano__ponto" aria-hidden="true"></span>
      <span class="plano__nome">Negócio</span>
      <span class="plano__spec">10 sites · 100 GB · domínio grátis</span>
      <span class="plano__preco"><span class="plano__moeda">R$</span><span class="plano__valor">39,90</span><span class="plano__mes">/mês</span></span>
    </button>
    <button class="plano" type="button" role="radio" aria-checked="false" data-plano="loja" data-mensal="79,90" data-anual="63,90">
      <span class="plano__ponto" aria-hidden="true"></span>
      <span class="plano__nome">Loja</span>
      <span class="plano__spec">loja virtual · 200 GB · CDN nas 12 regiões</span>
      <span class="plano__preco"><span class="plano__moeda">R$</span><span class="plano__valor">79,90</span><span class="plano__mes">/mês</span></span>
    </button>
    <button class="plano" type="button" role="radio" aria-checked="false" data-plano="servidor" data-mensal="149,90" data-anual="119,90">
      <span class="plano__ponto" aria-hidden="true"></span>
      <span class="plano__nome">Servidor</span>
      <span class="plano__spec">2 vCPU · 4 GB de RAM · 80 GB NVMe</span>
      <span class="plano__preco"><span class="plano__moeda">R$</span><span class="plano__valor">149,90</span><span class="plano__mes">/mês</span></span>
    </button>
  </div>

  <div class="planos__resumo" data-revela>
    <p class="planos__frase" aria-live="polite"><span class="planos__dominio" data-dominio>seunegocio.com.br</span> no plano <span data-plano-nome>Negócio</span>, <span data-plano-preco>R$ 39,90 por mês</span>.</p>
    <a class="botao botao--claro" href="#"><span class="rola" data-texto="Criar meu site">Criar meu site</span></a>
  </div>
  <p class="planos__nota" data-revela>Todos com SSL, backup diário e migração grátis. Cancele quando quiser.</p>
</section>
