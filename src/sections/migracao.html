<!-- 5. MIGRAÇÃO: a foto à esquerda, esfumada no preto; texto e formulário à direita, para onde ela olha -->
<section class="migracao" id="migracao" data-secao="migracao">
  <figure class="foto migracao__foto">
    <picture>
      <source media="(max-width: 760px)" srcset="/img/migracao-vertical-800.webp 800w, /img/migracao-vertical-1200.webp 1200w" sizes="100vw">
      <img src="/img/migracao-1800.webp" srcset="/img/migracao-1100.webp 1100w, /img/migracao-1800.webp 1800w, /img/migracao-2400.webp 2400w" sizes="(max-width: 760px) 100vw, 62vw" width="2400" height="1592" alt="Mulher trabalhando no notebook à noite, num balcão de madeira com uma luminária acesa" loading="lazy" decoding="async">
    </picture>
  </figure>
  <div class="migracao__conteudo">
    <div class="migracao__texto" data-revela>
      <h2 class="titulo">
        <span class="linha"><span>A mudança é</span></span>
        <span class="linha"><span>por nossa conta.</span></span>
      </h2>
      <p class="corpo">Trazemos site, e-mails e domínio de onde estiverem, sem tirar nada do ar. Você não precisa parar.</p>
    </div>
    <form class="linha-form" novalidate data-migracao data-revela>
      <label class="campo">
        <span class="campo__rotulo">Endereço do site</span>
        <input class="campo__input" name="site" type="text" data-vazio="Diga qual é o seu site." data-ruim="Confira o endereço (ex.: seusite.com.br)." inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="seusite.com.br">
        <span class="campo__linha" aria-hidden="true"></span>
        <span class="campo__erro" aria-live="polite"></span>
      </label>
      <label class="campo">
        <span class="campo__rotulo">Seu e-mail</span>
        <input class="campo__input" name="email" type="email" data-vazio="Precisamos do seu e-mail." data-ruim="Esse e-mail parece incompleto." autocomplete="email" placeholder="voce@email.com">
        <span class="campo__linha" aria-hidden="true"></span>
        <span class="campo__erro" aria-live="polite"></span>
      </label>
      <button class="botao" type="submit"><span class="rola" data-texto="Pedir a mudança">Pedir a mudança</span></button>
      <p class="linha-form__ok" role="status"><span class="ponto" aria-hidden="true"></span><span>Pedido recebido. Em até uma hora, alguém da Video One escreve para <b data-email-ok></b>.</span></p>
    </form>
  </div>
</section>
